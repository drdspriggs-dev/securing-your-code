name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Agency CLI
        timeout-minutes: 5
        shell: bash
        run: |
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --fail --show-error --silent --location \
            https://aka.ms/InstallTool.sh --output "$installer"
          bash "$installer" agency
          agency_dir="$HOME/.config/agency/CurrentVersion"
          "$agency_dir/agency" --version
          echo "$agency_dir" >> "$GITHUB_PATH"
      - name: Install Service360 Breeze plugin
        timeout-minutes: 5
        shell: bash
        run: |
          agency plugin install \
            mp:service360-breeze-official@company \
            --engine copilot
